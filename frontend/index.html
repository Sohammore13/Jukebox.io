<!DOCTYPE html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239B5CFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Midnight Aurora — Futuristic Sound Experience</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem("jukebox-theme");
					var theme =
						stored === "light" || stored === "dark"
							? stored
							: window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					var root = document.documentElement;
					root.classList.toggle("dark", theme === "dark");
					root.classList.toggle("light", theme === "light");
					root.dataset.theme = theme;
					root.style.colorScheme = theme;
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	</head>
	<body class="theme-surface antialiased selection:bg-[#9B5CFF]/30 selection:text-[#32D9FF]">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
